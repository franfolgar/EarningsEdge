<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EarningsEdge Pro v2</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #05080f;
  --surface: #0c1424;
  --surface2: #111c2e;
  --border: #1a2a40;
  --accent: #00e5ff;
  --gold: #f5c842;
  --long: #7fff6e;
  --short: #ff3b6b;
  --neutral: #f5c842;
  --text: #e8f0fe;
  --text-dim: #6a839e;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Syne', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  /* Fondo con gradientes estáticos, sin animaciones molestas */
  background-image: 
    radial-gradient(ellipse at 20% 20%, rgba(0,229,255,0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(127,255,110,0.03) 0%, transparent 50%);
  overflow-x: hidden;
}

/* Rejilla de fondo sutil y estática */
body::before {
  content: ''; position: fixed; inset: 0;
  background-image: linear-gradient(rgba(0,229,255,0.02) 1px, transparent 1px), 
                    linear-gradient(90deg, rgba(0,229,255,0.02) 1px, transparent 1px);
  background-size: 48px 48px; pointer-events: none; z-index: 0;
}

/* ── HEADER ── */
header {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 36px;
  border-bottom: 1px solid var(--border);
  background: rgba(5,8,15,0.92);
  backdrop-filter: blur(16px);
}

.logo { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 20px; letter-spacing: -0.5px; }
.logo-hex {
  width: 34px; height: 34px; background: var(--accent);
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.logo em { color: var(--accent); font-style: normal; text-shadow: 0 0 20px rgba(0,229,255,0.4); }

nav { display: flex; gap: 4px; }
.nav-btn {
  background: none; border: 1px solid transparent; color: var(--text-dim);
  padding: 8px 18px; border-radius: 8px; font-family: 'Syne'; font-weight: 700; font-size: 12px;
  letter-spacing: 1px; cursor: pointer; transition: all 0.2s;
}
.nav-btn.active { color: var(--accent); border-color: rgba(0,229,255,0.3); background: rgba(0,229,255,0.07); }

/* ── LAYOUT ── */
.app { position: relative; z-index: 1; display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 65px); }

/* ── SIDEBAR ── */
.sidebar { border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; background: rgba(12,20,36,0.5); }
.sec-label { font-family: 'Space Mono'; font-size: 9px; letter-spacing: 3px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; }

/* Watch cards */
.wcard {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 11px 13px; cursor: pointer;
  transition: all 0.2s; position: relative; margin-bottom: 8px;
}
.wcard.active { border-color: var(--accent); background: rgba(0,229,255,0.05); }

/* ── CARDS GRID ── */
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.big-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 20px; cursor: pointer; transition: 0.3s;
}
.big-card:hover { border-color: var(--accent); transform: translateY(-3px); }

/* ── ANALYSIS PANE ── */
.analysis-wrap { max-width: 900px; }
.score-full-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 18px; }
.score-row-main { display: flex; gap: 20px; align-items: center; }
.score-num { font-family: 'Space Mono'; font-size: 60px; font-weight: 700; line-height: 1; }

.signal-full { border-radius: 12px; padding: 22px; text-align: center; margin-bottom: 18px; background: var(--surface); border: 1px solid var(--border); }
.signal-full.long-s { border-color: var(--long); }
.signal-full.short-s { border-color: var(--short); }

.hbars { display: flex; align-items: flex-end; gap: 5px; height: 80px; padding-bottom: 20px; }
.hbar { flex: 1; border-radius: 3px 3px 0 0; position: relative; }
.hbar.beat { background: var(--long); }
.hbar.miss { background: var(--short); }

/* Toasts & Modals */
.toast { position: fixed; bottom: 22px; right: 22px; background: var(--surface2); border: 1px solid var(--accent); color: var(--text); padding: 11px 18px; border-radius: 8px; font-size: 12px; z-index: 1000; display: none; }
.toast.show { display: block; }

@media(max-width:860px){
  .app { grid-template-columns: 1fr; }
  .sidebar { max-height: 300px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-hex">⬡</div>
    Earnings<em>Edge</em>
    <span style="font-size: 9px; opacity: 0.6;">PRO v2.1</span>
  </div>
  <nav>
    <button class="nav-btn active" onclick="switchTab('watchlist')">WATCHLIST</button>
    <button class="nav-btn" onclick="switchTab('analysis')">ANÁLISIS</button>
  </nav>
  <div style="display: flex; gap: 10px;">
    <div style="color: var(--long); font-size: 10px; font-family: 'Space Mono'; border: 1px solid var(--long); padding: 4px 10px; border-radius: 20px;">● LIVE DATA</div>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="sec-label">📋 Mi Watchlist</div>
    <div id="watchList"></div>
    <div class="sec-label" style="margin-top: 20px;">⚡ Añadir Ticker</div>
    <div style="display: flex; gap: 5px;">
        <input id="tickerInput" class="ticker-input" style="width: 100%; background: var(--surface2); border: 1px solid var(--border); padding: 10px; border-radius: 8px; color: white; outline: none;" placeholder="Ej: NVDA">
        <button onclick="addStock()" style="background: var(--accent); border: none; padding: 10px 15px; border-radius: 8px; font-weight: 800; cursor: pointer;">+</button>
    </div>
  </aside>

  <main class="main-area">
    <div class="tab-pane active" id="tp-watchlist" style="padding: 30px;">
      <div class="cards-grid" id="cardsGrid"></div>
    </div>
    <div class="tab-pane" id="tp-analysis" style="padding: 30px;">
      <div id="analysisPanel"></div>
    </div>
  </main>
</div>

<div id="toast" class="toast"></div>

</script>
</body>
</html>
